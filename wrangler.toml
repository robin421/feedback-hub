name = "feedback-hub"
main = "src/index.js"
compatibility_date = "2024-04-01"

[vars]
# 默认兜底仓库（当提交的 pkg 未在 REPO_MAP 中匹配时落入此仓库）
GITHUB_DEFAULT_REPO = "robin421/feedback-inbox"

# 推荐使用的模型名称
GEMINI_MODEL = "gemini-3-flash-preview"

# 动态仓库映射 JSON 字符串（支持匹配到您现有的独立产品仓库）
REPO_MAP_JSON = '{"aisubdeal": "robin421/aisubdeal", "fitflow": "robin421/FitFlow", "bank-parser": "robin421/bank-statement-parser", "firstbend": "robin421/FirstBend", "conduit": "robin421/conduit-bend-calc"}'

# Google Sheets 在线表格直达链接
GOOGLE_SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/1fTsinvOlJmJmRFKntivtfv3B-63kk2A4Y1MycmkM6oQ/edit"

# 在线表格自动化追加 Webhook (通过 Google Apps Script 导出，详见 docs/GOOGLE_SHEETS_SETUP.md)
GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwdsCz6L-6SubG0Onl65Rfci7AlNHp5zSIChgY05u9FV9W4AHRJU-50jyg3qE-KNks3/exec"

# 2. 飞书多维表格 Webhook (通过飞书自动化流程导出，详见 docs/FEISHU_BITABLE_SETUP.md)
FEISHU_WEBHOOK_URL = ""

# 3. 腾讯文档在线表格配置 (在线实时表格查看地址)
TENCENT_DOCS_VIEW_URL = "https://docs.qq.com/sheet/DWndkdE1mTVZNSUtp"
TENCENT_DOCS_FILE_ID = "ZwdtMfMVMIKi"
TENCENT_DOCS_SHEET_ID = "BB08J2"

# 生产环境密钥请使用 Wrangler CLI 注入：
# npx wrangler secret put GEMINI_API_KEY
# npx wrangler secret put GITHUB_TOKEN
